<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d2721"><title>薪ストーブ メンテナンス管理</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#1f2822;--muted:#778078;--line:#e2e0da;--green:#385445;--green2:#dfe9e1;--orange:#b56b2b;--red:#a84c3c;--shadow:0 4px 18px #0000000d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding-bottom:86px}button,input,select,textarea{font:inherit}button{border:0}.app{max-width:760px;margin:auto}.top{position:sticky;top:0;z-index:5;background:#1d2721;color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.toprow{display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;font-size:19px}.sub{font-size:11px;color:#bdc7bf;margin-top:2px}.iconbtn{background:#ffffff18;color:#fff;border-radius:12px;padding:10px 12px}.main{padding:14px}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(135deg,#314a3a,#203126);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.hero h1{font-size:23px;margin:0 0 4px}.hero p{margin:0;color:#d8e1da;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:var(--muted)}.section{font-size:16px;font-weight:800;margin:18px 2px 9px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;outline:none}.btn{min-height:46px;border-radius:14px;padding:0 15px;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff}.light{background:var(--green2);color:var(--green)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#f8e6e2;color:var(--red)}.full{width:100%}.customer{margin-bottom:10px}.customer h3{margin:0 0 4px;font-size:16px}.customer p{margin:0;color:var(--muted);font-size:12px}.pill{display:inline-block;background:#eef1ee;color:#526258;border-radius:999px;padding:5px 8px;font-size:11px}.pill.warn{background:#fff0df;color:#a45d20}.pill.over{background:#f9e4df;color:#a54838}.schedule{border-left:4px solid var(--green);padding-left:12px}.schedule.overdue{border-left-color:var(--red)}.schedule h3{margin:0 0 5px;font-size:15px}.schedule small{color:var(--muted)}.fab{position:fixed;z-index:6;right:16px;bottom:78px;background:#b56b2b;color:#fff;border-radius:999px;padding:14px 18px;font-weight:800;box-shadow:0 7px 22px #0003}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bottom button{background:none;color:#68716b;font-size:11px;padding:6px}.bottom button.active{color:var(--green);font-weight:800}.bottom .ico{font-size:19px;display:block;margin-bottom:2px}.form label{display:block;font-size:12px;color:#5f6862;margin:13px 2px 6px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;outline:none}.form textarea{min-height:100px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:10px 13px;border:1px solid var(--line);border-radius:999px;background:#fff}.chip.sel{background:var(--green);color:#fff;border-color:var(--green)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo-grid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}.back{margin-bottom:10px}.history{position:relative;padding-left:18px}.history:before{content:"";position:absolute;left:5px;top:3px;bottom:3px;width:2px;background:#d7ddd8}.record{position:relative;margin-bottom:11px}.record:before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--green)}.record h3{margin:0;font-size:14px}.record p{margin:5px 0;color:#5f6862;font-size:12px}.record .compare{background:#f3f5f2;border-radius:10px;padding:8px;margin-top:6px}.barrow{display:grid;grid-template-columns:58px 1fr 48px;gap:7px;align-items:center;font-size:11px;margin:8px 0}.bar{height:9px;background:#e7e9e5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.empty{text-align:center;color:var(--muted);padding:28px 10px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;padding:16px;overflow:auto}.modal.show{display:block}.sheet{background:var(--bg);border-radius:20px;margin:20px auto;max-width:680px;padding:16px 14px 25px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:30}.toast.show{display:block}.muted{color:var(--muted)}.small{font-size:12px}@media(min-width:700px){.bottom{max-width:760px;margin:auto}.fab{right:calc((100vw - 760px)/2 + 16px)}}

@media print{
 @page{size:A4;margin:0}
 html,body{margin:0!important;padding:0!important;background:#fff!important;color:#111!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;position:static!important;width:210mm!important;margin:0!important;padding:0!important;background:#fff!important;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
 #printArea *{box-sizing:border-box}
 .report-page{position:relative;width:210mm;min-height:297mm;padding:12mm 12mm 22mm;background:#fff;page-break-after:always;overflow:hidden}
 .report-page:last-child{page-break-after:auto}
 .report-head{display:flex;align-items:flex-start;gap:8mm;margin-bottom:5mm}

 .section-title{display:inline-block;background:#111;color:#fff;font-size:11pt;font-weight:800;padding:2mm 5mm;border-radius:2mm 2mm 0 0;margin-top:3mm}
 .box{border:1px solid #555;padding:4mm;margin:0 0 4mm}
 .customer-hero{display:grid;grid-template-columns:1fr 70mm;gap:7mm;align-items:center;border-bottom:1px solid #333;padding:4mm 5mm 5mm;margin-bottom:3mm}
 .customer-hero.no-photo{grid-template-columns:1fr}
 .customer-name{font-size:19pt;font-weight:800;border-bottom:1px solid #777;padding:0 0 3mm;margin-bottom:4mm}
 .customer-address{font-size:10.5pt;border-bottom:1px solid #777;padding-bottom:4mm;margin-bottom:4mm}
 .stove-name{font-size:15pt;font-weight:800;letter-spacing:.05em}
 .stove-photo{width:70mm;height:52mm;object-fit:cover;border:1px solid #999}
 .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:3mm 0}
 .metric{border:1px solid #999;text-align:center;padding:4mm 2mm;min-height:25mm}
 .metric-label{font-size:9pt;font-weight:700}
 .metric-value{font-size:16pt;font-weight:800;margin-top:2mm}
 .meta-row{font-size:10pt;line-height:1.65;margin:1.5mm 0}
 .compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
 .compare-card{border:1px solid #999;padding:3mm;text-align:center}
 .compare-card h4{font-size:9pt;margin:0 0 2mm}
 .compare-card div{font-size:9pt;line-height:1.6}
 .red{color:#d60000;font-weight:800}
 .history-table{width:100%;border-collapse:collapse;font-size:8.5pt}
 .history-table th,.history-table td{border:1px solid #777;padding:2.5mm 2mm;vertical-align:top}
 .history-table th{font-weight:800;text-align:center;background:#fafafa}
 .history-table .datecell{width:23mm;text-align:center}
 .history-table .numcell{width:20mm;text-align:center}
 .history-table .photocell{width:37mm;text-align:center}
 .history-photo{width:31mm;height:31mm;object-fit:cover;border:1px solid #999;margin:1mm}
 .message{font-size:11pt;line-height:1.9;border:1px solid #777;padding:7mm;margin-top:7mm}
 .footer-contact{position:absolute;left:12mm;right:12mm;bottom:10mm;border:1px solid #555;display:grid;grid-template-columns:42mm 1fr;min-height:27mm;align-items:center}
 .footer-logo{width:36mm;height:22mm;object-fit:contain;margin:2mm 3mm}
 .contact-text{font-size:9.5pt;line-height:1.55}
 .contact-text .url{font-size:8pt;color:#333;word-break:break-all}
 .page-foot{position:absolute;left:12mm;right:12mm;bottom:3mm;display:flex;justify-content:space-between;font-size:7.5pt;color:#555}
 .internal-info{display:grid;grid-template-columns:1fr 1fr 58mm;border:1px solid #555}
 .internal-info>div{padding:3mm;border-right:1px solid #777;border-bottom:1px solid #777;font-size:9pt;min-height:11mm}
 .internal-info>div:nth-child(3n){border-right:0}
 .internal-info .full{grid-column:1/3}
 .internal-photo{grid-column:3;grid-row:1/4;display:flex;align-items:center;justify-content:center;border-bottom:0!important}

 .small-note{font-size:8pt;color:#555}
 .spacer{height:2mm}
}
</style></head><body><div class="app">
<header class="top"><div class="toprow"><div><div class="title">🔥 薪ストーブ管理</div><div class="sub">メンテナンス・薪・煤・写真をまとめて管理</div><div id="storageStatus" class="sub"></div></div><button class="iconbtn" onclick="showView('dashboard')">⌂</button></div></header>
<main class="main">
<section id="dashboard" class="view active"><div class="hero"><h1 id="greeting">おつかれさまです</h1><p>今日の予定と、お客様のメンテナンス状況を確認できます。</p></div><div class="stats"><div class="stat"><b id="statCustomers">0</b><span>登録顧客</span></div><div class="stat"><b id="statMonth">0</b><span>今月の予定</span></div><div class="stat"><b id="statWood">0</b><span>今シーズンの薪</span></div><div class="stat"><b id="statSoot">0 g</b><span>今シーズンの煤</span></div></div><div class="section">今日・近日の予定</div><div id="scheduleList"></div><div class="section">薪・煤の推移</div><div class="card" id="trend"></div></section>
<section id="customers" class="view"><div class="row between"><div class="section">お客様</div><button class="btn primary" onclick="openCustomerForm()">＋ 新規</button></div><input id="search" class="search" placeholder="名前・住所・電話番号で検索" oninput="renderCustomers()"><div id="customerList"></div></section>
<section id="customerDetail" class="view"></section>
<section id="recordForm" class="view"></section>
<section id="schedule" class="view"><div class="section">メンテナンス予定</div><div id="allSchedule"></div></section>
</main></div>
<button class="fab" onclick="openRecordForm()">＋ メンテナンス</button>
<nav class="bottom"><button id="nav-dashboard" class="active" onclick="showView('dashboard')"><span class="ico">⌂</span>ホーム</button><button id="nav-customers" onclick="showView('customers')"><span class="ico">👤</span>顧客</button><button id="nav-schedule" onclick="showView('schedule')"><span class="ico">📅</span>予定</button><button id="nav-recordForm" onclick="openRecordForm()"><span class="ico">＋</span>記録</button></nav>
<div id="printArea" style="display:none"></div><div id="modal" class="modal"><div class="sheet" id="modalBody"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='stoveApp';
let storageOK=true;
let data={customers:[],records:[]};
try{
  const raw=localStorage.getItem(KEY);
  data=raw?JSON.parse(raw):data;
}catch(e){
  storageOK=false;
}
data.customers=Array.isArray(data.customers)?data.customers:[];
data.records=Array.isArray(data.records)?data.records:[];
let selectedCustomer=null;
function save(){
  if(storageOK){
    try{localStorage.setItem(KEY,JSON.stringify(data));}
    catch(e){storageOK=false;}
  }
  renderAll();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return '—';const a=d.split('-');return `${a[0]}/${a[1]}/${a[2]}`}
function recordsFor(id){return data.records.filter(r=>r.customerId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function seasonKey(d){if(!d)return '';const y=+d.slice(0,4),m=+d.slice(5,7);return m>=4?String(y):String(y-1)}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id)?.classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+id)?.classList.add('active');if(id==='dashboard')renderDashboard();if(id==='customers')renderCustomers();if(id==='schedule')renderSchedule();window.scrollTo(0,0)}
function renderAll(){renderDashboard();renderCustomers();renderSchedule();if(selectedCustomer)renderCustomerDetail(selectedCustomer)}
function openCustomerForm(id=null){const c=id?data.customers.find(x=>x.id===id):{};modal(`<div class="row between"><h2>${id?'顧客情報を編集':'新しいお客様'}</h2><button class="btn ghost" onclick="closeModal()">閉じる</button></div><div class="form"><label>お名前 *</label><input id="cf-name" value="${esc(c.name)}"><label>住所</label><input id="cf-address" value="${esc(c.address)}"><label>電話番号</label><input id="cf-phone" value="${esc(c.phone)}" inputmode="tel"><label>メール</label><input id="cf-email" value="${esc(c.email)}" inputmode="email"><label>薪ストーブ</label><div class="grid2"><input id="cf-maker" placeholder="メーカー" value="${esc(c.maker)}"><input id="cf-model" placeholder="機種" value="${esc(c.model)}"></div><label>設置年</label><input id="cf-install" type="number" value="${esc(c.installYear)}" placeholder="例：2020"><label>メモ</label><textarea id="cf-note">${esc(c.note)}</textarea><button class="btn primary full" style="margin-top:15px" onclick="saveCustomer('${id||''}')">保存する</button></div>`)}
function saveCustomer(id){const name=document.getElementById('cf-name').value.trim();if(!name){alert('お名前を入力してください');return}let c=id?data.customers.find(x=>x.id===id):{id:uid()};Object.assign(c,{name,address:document.getElementById('cf-address').value,phone:document.getElementById('cf-phone').value,email:document.getElementById('cf-email').value,maker:document.getElementById('cf-maker').value,model:document.getElementById('cf-model').value,installYear:document.getElementById('cf-install').value,note:document.getElementById('cf-note').value});if(!id)data.customers.push(c);closeModal();selectedCustomer=c.id;save();showView('customerDetail')}
function renderCustomers(){const q=(document.getElementById('search')?.value||'').toLowerCase();const arr=data.customers.filter(c=>(c.name+' '+c.address+' '+c.phone).toLowerCase().includes(q));const el=document.getElementById('customerList');if(!arr.length){el.innerHTML='<div class="card empty">お客様がまだ登録されていません。<br>「＋ 新規」から登録できます。</div>';return}el.innerHTML=arr.map(c=>{const rs=recordsFor(c.id),last=rs[0];return `<div class="card customer" onclick="selectedCustomer='${c.id}';renderCustomerDetail('${c.id}');showView('customerDetail')"><div class="row between"><div><h3>${esc(c.name)}</h3><p>${esc(c.maker||'')} ${esc(c.model||'')}</p></div><span class="pill">${rs.length}件</span></div><p style="margin-top:8px">最終メンテ：${fmt(last?.date)}</p></div>`}).join('')}
function renderCustomerDetail(id){selectedCustomer=id;const c=data.customers.find(x=>x.id===id);if(!c)return;const rs=recordsFor(id);const last=rs[0],prev=rs[1];let cmp='';if(last&&prev){const wd=(+last.wood||0)-(+prev.wood||0),sd=(+last.soot||0)-(+prev.soot||0);cmp=`<div class="compare"><b>前回との比較</b><div class="small">薪：${wd>0?'+':''}${wd.toFixed(1)} ${last.woodUnit||''}　煤：${sd>0?'+':''}${sd.toFixed(0)} g</div></div>`}document.getElementById('customerDetail').innerHTML=`<button class="btn ghost back" onclick="showView('customers')">← 顧客一覧</button><div class="card"><div class="row between"><div><h2 style="margin:0 0 4px">${esc(c.name)}</h2><div class="muted small">${esc(c.address||'住所未登録')}</div></div><div class="row" style="gap:6px"><button class="btn light" onclick="openCustomerForm('${c.id}')">編集</button><button class="btn ghost" onclick="printCustomerPDF('${c.id}','customer')">お客様用PDF</button><button class="btn ghost" onclick="printCustomerPDF('${c.id}','internal')">社用PDF</button></div></div><p class="small">${esc(c.phone||'')}　${esc(c.maker||'')} ${esc(c.model||'')}</p></div><button class="btn primary full" style="margin:12px 0" onclick="openRecordForm('${c.id}')">＋ このお客様のメンテナンスを記録</button><div class="section">メンテナンス履歴</div><div class="history">${rs.length?rs.map(r=>recordHtml(r,rs[rs.indexOf(r)+1])).join(''):'<div class="card empty">まだ記録がありません。</div>'}</div>`}
function recordHtml(r,prev){let photos=(r.photos||[]).map(p=>`<img src="${p}" alt="写真">`).join('');return `<div class="card record"><div class="row between" style="gap:8px"><h3>${fmt(r.date)} ${r.time||''}</h3><button class="btn light" style="min-height:38px;padding:0 13px" onclick="openRecordForm('${r.customerId}','${r.id}')">編集</button></div><p>煤 <b>${r.soot||0} g</b>　薪 <b>${r.wood||0} ${esc(r.woodUnit||'')}</b> ${esc(r.woodType||'')}</p><p>${esc(r.content||'')}</p>${r.nextDate?`<span class="pill">次回 ${fmt(r.nextDate)}</span>`:''}${r.memo?`<p>📝 ${esc(r.memo)}</p>`:''}${photos?`<div class="photo-grid" style="margin-top:8px">${photos}</div>`:''}</div>`}
let editingRecordId=null;
function openRecordForm(customerId=selectedCustomer,recordId=null){
  const c=customerId?data.customers.find(x=>x.id===customerId):null;
  const rec=recordId?data.records.find(x=>x.id===recordId):null;
  if(recordId&&!rec)return;
  editingRecordId=recordId;
  pendingPhotos=rec?(rec.photos||[]).slice():[];
  const d=new Date();
  const val=(v,def='')=>esc(v??def);
  const existingPhotos=pendingPhotos.map(p=>`<img src="${p}" alt="写真">`).join('');
  document.getElementById('recordForm').innerHTML=`<button class="btn ghost back" onclick="${c?`selectedCustomer='${c.id}';showView('customerDetail')`:`showView('dashboard')`}">← 戻る</button><div class="card form"><div class="row between"><h2 style="margin-top:0">${rec?'メンテナンス記録を編集':'メンテナンス記録'}</h2>${rec?`<button class="btn ghost" onclick="cancelRecordEdit()">キャンセル</button>`:''}</div><label>お客様 *</label><select id="rf-customer" ${rec?'disabled':''}><option value="">選択してください</option>${data.customers.map(x=>`<option value="${x.id}" ${x.id===customerId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="grid2"><div><label>メンテナンス日 *</label><input id="rf-date" type="date" value="${val(rec?.date,today())}"></div><div><label>時刻</label><input id="rf-time" type="time" value="${val(rec?.time,String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'))}"></div></div><div class="grid2"><div><label>煤の量（g）</label><input id="rf-soot" type="number" step="1" inputmode="decimal" value="${val(rec?.soot)}" placeholder="例：180"></div><div><label>薪の量</label><input id="rf-wood" type="number" step="0.1" inputmode="decimal" value="${val(rec?.wood)}" placeholder="例：3.5"></div></div><label>薪の単位</label><div class="chips" id="unitchips"><button class="chip ${rec?.woodUnit==='㎥'||!rec?'sel':''}" onclick="pickUnit(this,'㎥')">㎥</button><button class="chip ${rec?.woodUnit==='kg'?'sel':''}" onclick="pickUnit(this,'kg')">kg</button><button class="chip ${rec?.woodUnit==='束'?'sel':''}" onclick="pickUnit(this,'束')">束</button></div><input type="hidden" id="rf-unit" value="${val(rec?.woodUnit,'㎥')}"><label>薪の種類</label><input id="rf-woodtype" placeholder="例：ナラ・広葉樹ミックス" value="${val(rec?.woodType)}"><label>メンテナンス内容</label><textarea id="rf-content" placeholder="煙突掃除、炉内清掃、ガスケット確認など">${val(rec?.content)}</textarea><label>次回メンテナンス予定日</label><input id="rf-next" type="date" value="${val(rec?.nextDate)}"><label>写真</label><input id="rf-photos" type="file" accept="image/*" multiple onchange="previewPhotos(this)"><div id="photoPreview" class="photo-grid" style="margin-top:8px">${existingPhotos}</div><div class="small muted" style="margin-top:5px">写真を選び直さなければ、現在の写真をそのまま保持します。</div><label>メモ</label><textarea id="rf-memo" placeholder="お客様への伝達事項など">${val(rec?.memo)}</textarea><button class="btn primary full" style="margin-top:15px" onclick="saveRecord(${rec?`'${rec.id}'`:''})">${rec?'変更を保存':'この内容で保存'}</button></div>`;
  showView('recordForm');
}
function cancelRecordEdit(){editingRecordId=null;pendingPhotos=[];if(selectedCustomer){renderCustomerDetail(selectedCustomer);showView('customerDetail')}else{showView('dashboard')}}
function pickUnit(btn,u){document.querySelectorAll('#unitchips .chip').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');document.getElementById('rf-unit').value=u}
let pendingPhotos=[];function previewPhotos(input){pendingPhotos=[];const out=document.getElementById('photoPreview');out.innerHTML='';[...input.files].slice(0,8).forEach(f=>{const r=new FileReader();r.onload=e=>{pendingPhotos.push(e.target.result);out.insertAdjacentHTML('beforeend',`<img src="${e.target.result}">`)};r.readAsDataURL(f)})}
function saveRecord(recordId=''){
  const customerId=document.getElementById('rf-customer').value;
  if(!customerId){alert('お客様を選択してください');return}
  const payload={customerId,date:document.getElementById('rf-date').value,time:document.getElementById('rf-time').value,soot:+document.getElementById('rf-soot').value||0,wood:+document.getElementById('rf-wood').value||0,woodUnit:document.getElementById('rf-unit').value,woodType:document.getElementById('rf-woodtype').value,content:document.getElementById('rf-content').value,nextDate:document.getElementById('rf-next').value,photos:pendingPhotos,memo:document.getElementById('rf-memo').value};
  if(recordId){
    const rec=data.records.find(x=>x.id===recordId);
    if(!rec)return;
    Object.assign(rec,payload);
    toast('メンテナンス記録を変更しました');
  }else{
    data.records.push({id:uid(),...payload});
    toast('メンテナンス記録を保存しました');
  }
  editingRecordId=null;
  pendingPhotos=[];
  save();
  selectedCustomer=customerId;
  renderCustomerDetail(customerId);
  showView('customerDetail');
}
function schedules(){const arr=[];data.records.forEach(r=>{if(r.nextDate){const c=data.customers.find(x=>x.id===r.customerId);if(c)arr.push({date:r.nextDate,c,r})}});return arr.sort((a,b)=>a.date.localeCompare(b.date))}
function schedHtml(x){const diff=Math.ceil((new Date(x.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);let cls=diff<0?'overdue':'';let label=diff<0?`${Math.abs(diff)}日超過`:diff===0?'今日':`あと${diff}日`;return `<div class="card schedule ${cls}" onclick="selectedCustomer='${x.c.id}';renderCustomerDetail('${x.c.id}');showView('customerDetail')"><div class="row between"><div><h3>${esc(x.c.name)}</h3><small>${fmt(x.date)}　${esc(x.c.maker||'')} ${esc(x.c.model||'')}</small></div><span class="pill ${diff<=7?'warn':''} ${diff<0?'over':''}">${label}</span></div></div>`}
function renderSchedule(){const arr=schedules();document.getElementById('allSchedule').innerHTML=arr.length?arr.map(schedHtml).join(''):'<div class="card empty">登録された次回予定はありません。</div>'}
function renderDashboard(){const now=new Date(),ym=today().slice(0,7),season=seasonKey(today());document.getElementById('statCustomers').textContent=data.customers.length;document.getElementById('statMonth').textContent=schedules().filter(x=>x.date.startsWith(ym)).length;const seasonRecords=data.records.filter(r=>seasonKey(r.date)===season);const units={};seasonRecords.forEach(r=>units[r.woodUnit]=(units[r.woodUnit]||0)+(r.wood||0));document.getElementById('statWood').textContent=Object.entries(units).map(([u,v])=>v.toFixed(1)+u).join(' / ')||'0';document.getElementById('statSoot').textContent=(seasonRecords.reduce((a,r)=>a+(+r.soot||0),0)).toFixed(0)+' g';const upcoming=schedules().filter(x=>{const d=(new Date(x.date)-new Date(today()))/86400000;return d<=30}).slice(0,5);document.getElementById('scheduleList').innerHTML=upcoming.length?upcoming.map(schedHtml).join(''):'<div class="card empty">30日以内の予定はありません。</div>';renderTrend()}
function renderTrend(){const years={};data.records.forEach(r=>{const y=(r.date||'').slice(0,4);if(!y)return;if(!years[y])years[y]={wood:0,soot:0};years[y].wood+=+r.wood||0;years[y].soot+=+r.soot||0});const ys=Object.keys(years).sort().slice(-5);const maxW=Math.max(1,...ys.map(y=>years[y].wood)),maxS=Math.max(1,...ys.map(y=>years[y].soot));document.getElementById('trend').innerHTML=ys.length?ys.map(y=>`<div class="barrow"><b>${y}</b><div><div class="bar"><i style="width:${years[y].wood/maxW*100}%"></i></div><div class="small muted">薪 ${years[y].wood.toFixed(1)}</div></div><span>煤 ${years[y].soot.toFixed(0)}g</span></div>`).join(''):'<div class="empty">記録が増えると、薪と煤の推移がここに表示されます。</div>'}

function printCustomerPDF(customerId,mode='customer'){
  const c=data.customers.find(x=>x.id===customerId);
  if(!c)return;
  const rs=recordsFor(customerId);
  const escP=s=>esc(s||'');
  const last=rs[0];
  let lastYearRec=null;
  if(last&&last.date){
    const targetYear=String(+last.date.slice(0,4)-1);
    const candidates=rs.filter(r=>r.date&&r.date.slice(0,4)===targetYear);
    if(candidates.length){
      const target=new Date(last.date+'T00:00:00').getTime();
      lastYearRec=candidates.slice().sort((a,b)=>Math.abs(new Date(a.date+'T00:00:00').getTime()-target)-Math.abs(new Date(b.date+'T00:00:00').getTime()-target))[0];
    }
  }
  const soot=(r)=>+r?.soot||0;
  const wood=(r)=>+r?.wood||0;
  const perM3=(r)=>r&&r.woodUnit==='㎥'&&wood(r)>0?(soot(r)/wood(r)).toFixed(0)+' g/㎥':'—';
  const diffText=(n,unit='')=>(n>0?'+':'')+n.toFixed(unit==='g'?0:1)+' '+unit;
  const totalSoot=rs.reduce((a,r)=>a+soot(r),0);
  const logo='./logo.png';
  const latestPhoto=(last?.photos||[]).filter(Boolean)[0]||'';
  const photoHtml=latestPhoto?`<img class="stove-photo" src="${latestPhoto}" alt="メンテナンス写真">`:'';
  const compareSection=last&&lastYearRec?`<div class="section-title">昨年との比較</div><div class="box"><div class="meta-row">昨年の実施日：${fmt(lastYearRec.date)}　／　今回：${fmt(last.date)}</div><div class="compare-grid"><div class="compare-card"><h4>煤の量</h4><div>昨年　${soot(lastYearRec)} g</div><div>今回　<span class="red">${soot(last)} g</span></div><div>差：<span class="red">${diffText(soot(last)-soot(lastYearRec),'g')}</span></div></div><div class="compare-card"><h4>薪1㎥あたりの煤</h4><div>昨年　${perM3(lastYearRec)}</div><div>今回　<span class="red">${perM3(last)}</span></div><div>${last.woodUnit==='㎥'&&lastYearRec.woodUnit==='㎥'&&wood(last)>0&&wood(lastYearRec)>0?`差：<span class="red">${diffText((soot(last)/wood(last))-(soot(lastYearRec)/wood(lastYearRec)),'g/㎥')}</span>`:'差：—'}</div></div><div class="compare-card"><h4>薪の使用量</h4><div>昨年　${wood(lastYearRec)} ${escP(lastYearRec.woodUnit)}</div><div>今回　${wood(last)} ${escP(last.woodUnit)}</div><div>${last.woodUnit===lastYearRec.woodUnit?`差：${diffText(wood(last)-wood(lastYearRec),last.woodUnit||'')}`:'差：単位が異なるため比較なし'}</div></div></div></div>`:`<div class="section-title">昨年との比較</div><div class="box"><div class="small-note">昨年の同じ暦年に該当するメンテナンス記録がありません。</div></div>`;
  const footer=(page,total)=>`<div class="footer-contact"><img class="footer-logo" src="${logo}" alt="ロゴ"><div class="contact-text">〒010-0825 秋田県秋田市柳田字境田135<br>TEL:090-2366-5465<br>bonfireaddiction@gmail.com</div></div><div class="page-foot"><span>https://thefirewoodhunters.github.io/stove-maintenance/</span><span>${fmt(today())}　 ${page} / ${total} ページ</span></div>`;
  const currentMetrics=last?`<div class="metric-grid"><div class="metric"><div class="metric-label">煤の量</div><div class="metric-value">${soot(last)} g</div></div><div class="metric"><div class="metric-label">薪1㎥あたりの煤</div><div class="metric-value">${perM3(last)}</div></div><div class="metric"><div class="metric-label">薪の使用量</div><div class="metric-value">${wood(last)} ${escP(last.woodUnit)}</div></div></div>`:'';
  const historyRows=rs.map(r=>{
    const pics=(r.photos||[]).filter(Boolean).map(p=>`<img class="history-photo" src="${p}" alt="写真">`).join('');
    return `<tr><td class="datecell">${fmt(r.date)}<br>${escP(r.time||'')}</td><td class="numcell">${soot(r)} g</td><td class="numcell">${perM3(r)}</td><td class="numcell">${wood(r)} ${escP(r.woodUnit)}</td><td><b>薪の種類：</b>${escP(r.woodType)||'—'}<br><b>内　容：</b>${escP(r.content)||'—'}<br><b>次　回：</b>${r.nextDate?fmt(r.nextDate):'—'}<br>${mode==='internal'?`<b>内部メモ：</b>${escP(r.memo)||'—'}`:''}</td><td class="photocell">${pics||'—'}</td></tr>`;
  }).join('');
  const area=document.getElementById('printArea');
  if(mode==='customer'){
    area.innerHTML=`<div class="report-page"><div class="report-head"><img class="report-logo" src="${logo}" alt="ロゴ"><div class="report-head-main"><div class="report-title">薪ストーブ メンテナンス結果報告書</div><div class="report-date">発行日：${fmt(today())}</div></div></div><div class="customer-hero ${photoHtml?'':'no-photo'}"><div><div class="customer-name">${escP(c.name)} 様</div><div class="customer-address">${escP(c.address||'住所未登録')}</div><div class="stove-name">${escP(c.maker)} ${escP(c.model)}</div></div>${photoHtml}</div><div class="section-title">今回のメンテナンス</div><div class="box"><div class="meta-row">実施日：${last?fmt(last.date)+' '+escP(last.time||''): '—'}</div>${currentMetrics}<div class="meta-row">薪の種類：${last?escP(last.woodType)||'—':'—'}</div><div class="meta-row">実施内容：${last?escP(last.content)||'—':'—'}</div></div>${compareSection}<div class="message">今回のメンテナンス結果をご報告します。<br>ご不明な点がありましたらお気軽にお問い合わせください。</div>${footer(1,2)}</div><div class="report-page"><div class="report-head"><img class="report-logo" src="${logo}" alt="ロゴ"><div class="report-head-main"><div class="report-title">メンテナンス記録</div><div class="report-sub">${escP(c.name)} 様　${escP(c.maker)} ${escP(c.model)}</div></div></div><div class="section-title">メンテナンス履歴</div><div class="box"><table class="history-table"><thead><tr><th>実施日</th><th>煤</th><th>薪1㎥あたりの煤</th><th>薪</th><th>内容</th><th>写真</th></tr></thead><tbody>${historyRows||'<tr><td colspan="6">記録なし</td></tr>'}</tbody></table></div>${footer(2,2)}</div>`;
  }else{
    area.innerHTML=`<div class="report-page"><div class="report-head"><img class="report-logo" src="${logo}" alt="ロゴ"><div class="report-head-main"><div class="report-title">薪ストーブ メンテナンス詳細カルテ</div><div class="report-date">社内管理用・発行日：${fmt(today())}</div></div></div><div class="section-title">顧客カルテ</div><div class="internal-info"><div>氏名：${escP(c.name)}</div><div>メーカー：${escP(c.maker)}</div><div class="internal-photo">${photoHtml||'—'}</div><div>住所：${escP(c.address||'—')}</div><div>型式：${escP(c.model||'—')}</div><div>設置年：${escP(c.installYear||'—')}</div><div>電話：${escP(c.phone||'—')}</div><div>顧客メモ：${escP(c.note||'—')}</div><div>メール：${escP(c.email||'—')}</div></div>${compareSection}${footer(1,3)}</div><div class="report-page"><div class="report-head"><img class="report-logo" src="${logo}" alt="ロゴ"><div class="report-head-main"><div class="report-title">薪ストーブ メンテナンス詳細カルテ</div><div class="report-date">メンテナンス履歴（全件）</div></div></div><div class="section-title">メンテナンス履歴（全件）</div><div class="box"><table class="history-table"><thead><tr><th>実施日</th><th>煤</th><th>薪1㎥あたりの煤</th><th>薪</th><th>薪の種類・内容・次回・内部メモ</th><th>写真</th></tr></thead><tbody>${historyRows||'<tr><td colspan="6">記録なし</td></tr>'}</tbody></table></div>${footer(2,3)}</div><div class="report-page"><div class="report-head"><img class="report-logo" src="${logo}" alt="ロゴ"><div class="report-head-main"><div class="report-title">薪ストーブ メンテナンス詳細カルテ</div><div class="report-date">社内保管用</div></div></div><div class="message">顧客：${escP(c.name)} 様<br>記録件数：${rs.length} 件<br>累計煤：${totalSoot.toFixed(0)} g<br>最新の薪1㎥あたりの煤：${perM3(last)}</div>${footer(3,3)}</div>`;
  }
  area.style.display='block';
  requestAnimationFrame(()=>setTimeout(()=>{window.print();setTimeout(()=>{area.style.display='none';},800);},250));
}

function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
renderAll();
const status=document.getElementById('storageStatus');
if(status) status.textContent=storageOK?'データ保存：このiPhone':'一時保存モード（Safariで開くと保存できます）';
</script></body></html>
